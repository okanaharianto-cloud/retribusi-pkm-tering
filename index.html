function autoFillHarga(selectElement) {
const row = selectElement.closest('tr');
const inputManual = row.querySelector('.t-nama-manual');
const inputSarana = row.querySelector('.t-sarana');
const inputPelayanan = row.querySelector('.t-pelayanan');
if (selectElement.value === 'LAINNYA') {
inputManual.style.display = 'block';
inputManual.value = '';
inputSarana.value = 0;
inputPelayanan.value = 0;
inputSarana.removeAttribute('readonly');
inputPelayanan.removeAttribute('readonly');
} else {
inputManual.style.display = 'none';
inputManual.value = '';
const selectedOption = selectElement.options[selectElement.selectedIndex];
inputSarana.value = selectedOption.getAttribute('data-sarana') || 0;
inputPelayanan.value = selectedOption.getAttribute('data-pelayanan') || 0;
inputSarana.setAttribute('readonly', true);
inputPelayanan.setAttribute('readonly', true);
}
}
